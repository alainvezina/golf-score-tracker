<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Golf Score Tracker - Premium Card Room v1.0.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gradient-to-br from-emerald-900 via-emerald-800 to-emerald-900 min-h-screen font-inter card-room-bg">
    <!-- Subtle pattern overlay -->
    <div class="fixed inset-0 opacity-10 pointer-events-none">
        <div class="card-pattern absolute inset-0"></div>
    </div>
    
    <!-- Floating burger menu: outside game board so clicks always work -->
    <div id="game-burger-wrap" class="game-burger-wrap" style="display: none;" aria-label="Game actions">
        <button type="button" id="game-burger-btn" class="game-burger-btn" aria-expanded="false" aria-controls="game-burger-menu" aria-label="Open menu">
            <span class="game-burger-icon" aria-hidden="true"></span>
        </button>
        <div id="game-burger-menu" class="game-burger-menu" aria-label="Game actions menu">
            <button type="button" id="burger-clear-round" class="game-burger-item">🎲 Clear Round</button>
            <button type="button" id="burger-clear-all" class="game-burger-item">🗑️ Clear All</button>
            <button type="button" id="burger-new-game" class="game-burger-item">🆕 New Game</button>
            <button type="button" id="burger-reset" class="game-burger-item">🔄 Reset Game</button>
            <button type="button" id="burger-export" class="game-burger-item">📊 Export Summary</button>
        </div>
    </div>

    <div class="container mx-auto px-4 py-4 max-w-6xl pb-24 relative z-10 safe-area-top safe-area-bottom home-container">
        <!-- Elegant Header (hidden during game to save space) -->
        <header id="app-header" class="text-center home-header">
            <div class="bg-gradient-to-r from-amber-50 via-amber-25 to-amber-50 border-2 border-amber-400 rounded-2xl p-4 shadow-2xl backdrop-blur-sm bg-opacity-95">
                <div class="flex items-center justify-center mb-1">
                    <span class="text-xl mr-2">♠️</span>
                    <h1 class="text-2xl sm:text-3xl font-bold text-emerald-900 font-cinzel tracking-wide">Golf Score Tracker</h1>
                    <span class="text-xl ml-2">♥️</span>
                </div>
                <div class="flex items-center justify-center">
                    <span class="text-amber-600 text-xs font-medium">♦️</span>
                    <p class="text-emerald-800 text-xs font-medium mx-1 font-cinzel">Premium 8-Card Golf</p>
                    <span class="text-amber-600 text-xs font-medium">♣️</span>
                </div>
            </div>
        </header>

        <!-- Player Setup Section -->
        <div id="player-setup" class="card-section home-player-setup">
            <div class="flex items-center justify-center mb-4">
                <span class="text-amber-500 text-base mr-2">♟️</span>
                <h2 class="text-xl font-bold text-amber-100 font-cinzel tracking-wide">Players Registry</h2>
                <span class="text-amber-500 text-base ml-2">♟️</span>
            </div>
            <div class="flex flex-col sm:flex-row gap-3 mb-4">
                <input 
                    type="text" 
                    id="player-name" 
                    placeholder="Enter player name..." 
                    class="flex-1 px-4 py-3 bg-amber-50 border-2 border-amber-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-amber-500 text-emerald-900 min-h-[44px] font-medium placeholder-emerald-700 text-sm"
                >
                <button 
                    id="add-player" 
                    class="premium-btn bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-700 hover:to-amber-600 text-white px-6 py-3 rounded-xl font-bold transition-all transform hover:scale-105 min-h-[44px] shadow-lg text-sm"
                >
                    🎩 Add Player
                </button>
                <button 
                    id="start-game" 
                    class="premium-btn bg-gradient-to-r from-emerald-700 to-emerald-600 hover:from-emerald-800 hover:to-emerald-700 text-white px-6 py-3 rounded-xl font-bold transition-all transform hover:scale-105 min-h-[44px] shadow-lg text-sm"
                    style="display: none;"
                >
                    🎮 Start Game
                </button>
            </div>
            <div id="players-list" class="flex flex-wrap gap-3 items-center"></div>
        </div>

        <!-- Game Board -->
        <div id="game-board" class="card-section game-board-compact" style="display: none;">
            <div class="game-board-header">
                <div class="flex items-center">
                    <span class="text-amber-500 mr-2">🃏</span>
                    <h2 class="text-xl font-bold text-amber-100 font-cinzel">Game Table</h2>
                </div>
                <div class="flex items-center gap-2">
                    <div class="round-badge">
                        🎯 Round <span id="current-round" class="current-round-num">1</span><span class="round-of">/9</span>
                    </div>
                    <span class="text-amber-200/80 text-xs" id="game-version">Version: <span id="version-number">—</span></span>
                </div>
            </div>
            <div class="game-stats-bar">
                <div class="round-progress" id="round-progress" aria-label="Round progress">
                    <!-- 1–9 dots filled by script -->
                </div>
                <div class="leading-summary" id="leading-summary" aria-live="polite">
                    <!-- Leading: Name (total) filled by script -->
                </div>
            </div>
            <p class="keyboard-hint" aria-hidden="true">Tab / Enter: next · ↑↓: prev/next round</p>
            
            <!-- Premium Score Table: Rounds as rows, Players as columns -->
            <div class="score-table-wrapper overflow-x-auto overflow-y-auto bg-amber-50 border-2 border-amber-400 rounded-xl shadow-xl">
                <table id="score-table" class="w-full border-collapse">
                    <thead>
                        <tr id="score-table-header-row" class="bg-gradient-to-r from-emerald-800 to-emerald-700">
                            <!-- Round label + player names filled by script -->
                        </tr>
                    </thead>
                    <tbody id="score-table-body">
                        <!-- Round rows + Total row filled by script -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Confirmation modal -->
    <div id="confirm-modal" class="confirm-modal" role="dialog" aria-labelledby="confirm-modal-title" aria-modal="true" hidden>
        <div class="confirm-modal-backdrop"></div>
        <div class="confirm-modal-box">
            <p id="confirm-modal-message" class="confirm-modal-message"></p>
            <div class="confirm-modal-actions">
                <button type="button" id="confirm-modal-cancel" class="premium-btn bg-gradient-to-r from-slate-600 to-slate-500 hover:from-slate-700 hover:to-slate-600 text-white px-6 py-3 rounded-xl font-bold">Cancel</button>
                <button type="button" id="confirm-modal-ok" class="premium-btn bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-700 hover:to-amber-600 text-white px-6 py-3 rounded-xl font-bold">Confirm</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
